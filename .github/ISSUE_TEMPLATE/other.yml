name: Other
description: Anything that is not a bug report or a feature request goes here, I guess?
title: "[Other]: "
labels: ["other"]
assignees:
  - laninternet
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to fill out well... anything
  - type: input
    id: contact
    attributes:
      label: Contact Details
      description: How can we get in touch with you if we need more info?
      placeholder: e.g. email@example.com
    validations:
      required: false
  - type: textarea
    id: description
    attributes:
      label: What is going on in your mind?
      description: Write down here whatever you wanted to tell us here
      placeholder: Scribble stuff down here...
    validations:
      required: true
